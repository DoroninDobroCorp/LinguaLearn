# Docker Compose override для production с internal networks
# Использование: docker-compose -f docker-compose.yaml -f docker-compose.internal-networks.yml up
#
# Internal networks обеспечивают:
# - Изоляцию между сервисами
# - Защиту внутренних API от внешнего доступа
# - Безопасную коммуникацию между контейнерами

version: "3.8"

services:
  calculator:
    networks:
      - livebets          # Публичная сеть для внешних клиентов
      - calculator-internal  # Внутренняя сеть для коммуникации с analyzer

networks:
  # Внутренняя сеть для calculator <-> analyzer
  calculator-internal:
    driver: bridge
    internal: false  # Оставляем false для доступа к analyzer
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24
  
  livebets:
    external: true

# Примечания:
# 1. Analyzer должен быть также в calculator-internal сети
# 2. Internal: true - полная изоляция (нет интернета)
# 3. Internal: false - есть доступ между контейнерами, но контролируем routing
# 4. Для полной изоляции используйте firewall rules на хосте
