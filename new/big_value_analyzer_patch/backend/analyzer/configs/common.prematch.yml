pairs_matching:
  send_interval: 5000 # Milliseconds - 5 sec for prematch (parsers update every 30-60s)
  update_keys_cache_interval: 30
  update_pairs_cache_interval: 30
  clear_cache_interval: 15
  match_data_timeout: 90
  receive_workers_count: 12  # Increased: prematch sends ~1800 events/state via forwarder
  pair_timeout: 60  # Max allowed by config validation
  min_roi_threshold: -1.0 # Minimum ROI % — show all matched pairs (filter in frontend)
  max_price_age_seconds: 90 # PREMATCH: never publish older than the cache/betting freshness window
  max_price_age_for_betting_seconds: 90 # PREMATCH: specials via MORE_BET cycle up to 90s
  enable_low_odds: true
  low_odds_threshold: 1.3
  log_pinnacle_interval: 60  # OPTIMIZED 2025-12-02: 60 sec for prematch (default 20 for live)
  enable_equivalences_v2: true # V2: canonical market matching (Win=H-0.5, DC=H+0.5, CS 0-0=T<0.5)
  min_stability_seconds: 0 # PREMATCH: no stability filter (data updates slowly, no flicker)

price_storage:
  clear_interval: 300
  data_timeout: 3000

channels:
  receive_buffer_size: 500    # Parser input buffer (scaled for 10+ bookmakers)
  send_buffer_size: 500

security:
  allowed_origins:
    - "*"
  api_keys:
    pinnacle: "pinnacle_secret_key_change_in_production"
    sansabet: "sansabet_secret_key_change_in_production"
    lobbet: "lobbet_secret_key_change_in_production"
    betcenter: "betcenter_secret_key_change_in_production"
    unibet: "unibet_secret_key_change_in_production"
    hatbet: "hatbet_secret_key_change_in_production"
    zlatnik: "zlatnik_secret_key_change_in_production"
    soccerbet: "soccerbet_secret_key_change_in_production"
    volcano: "volcano_secret_key_change_in_production"
    sbbet: "sbbet_secret_key_change_in_production"
    ggbet: "ggbet_secret_key_change_in_production"
    vbet: "vbet_secret_key_change_in_production"
    betfair: "betfair_secret_key_change_in_production"
