sansa:
  api:
    url: https://apilive.sansabet.com/
    timeout: 2
    matches_url: api/LiveOdds/GetAll
    odds_url: api/LiveOdds/GetByParIDs
    interval_match: 60  # Increased from 2 to 60 (once per minute)
    interval_odds: 2
    parse_live: true  # true = only live (MS == "IP"), false = only prematch (MS != "IP")
    prematch_interval_match: 60  # Prematch updates every 60 seconds
    prematch_interval_odds: 20   # Prematch odds every 20 seconds
