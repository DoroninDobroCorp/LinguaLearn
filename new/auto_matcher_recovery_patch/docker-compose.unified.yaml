# Единый docker-compose для Auto Matcher
# Использование:
#   Live:     MODE=live docker compose -f docker-compose.unified.yaml up -d
#   Prematch: MODE=prematch docker compose -f docker-compose.unified.yaml up -d

services:
  auto_matcher:
    container_name: auto_matcher_${MODE:-live}
    entrypoint: /auto_matcher
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: always
    ports:
      - "${PORT:-7001}:7001"
    env_file:
      - ./.env
    environment:
      - MODE=${MODE:-live}
      - ANALYZER_URL=${ANALYZER_URL:-http://analyzer:7005/}
      - ANALYZER_TIMEOUT=${ANALYZER_TIMEOUT:-10}
      - INTERVAL_LEAGUES=${INTERVAL_LEAGUES:-240}
      - INTERVAL_TEAMS=${INTERVAL_TEAMS:-180}
    volumes:
      - ./configs:/configs:ro
    networks:
      - livebets

networks:
  livebets:
    external: true
