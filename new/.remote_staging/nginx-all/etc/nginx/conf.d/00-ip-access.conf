server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/ibet.team/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ibet.team/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root /var/www/html;
    index ip-access.html;

    location = / {
        try_files /ip-access.html =404;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /admin/ {
        allow 127.0.0.1;
        allow ::1;
        include /etc/nginx/snippets/allowed-ips.conf;
        deny all;
        proxy_pass http://localhost:31562/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Public client - Raw IP sports list
    location = /api/auto-matcher/hand-merge/sports {
        include /etc/nginx/snippets/public-client-api.conf;
        proxy_pass http://localhost:7050/hand-merge/sports;
    }

    # Public client - Raw IP bookmakers list
    location = /api/auto-matcher/hand-merge/bookmakers {
        include /etc/nginx/snippets/public-client-api.conf;
        proxy_pass http://localhost:7050/hand-merge/bookmakers;
    }

    # Public client - Raw IP calculator bet sizing
    location = /api/calculator/calc-bet {
        include /etc/nginx/snippets/public-client-api.conf;
        proxy_pass http://localhost:7010/calc-bet;
    }

    # Public client - Raw IP calculator limits
    location = /api/calculator/check-betting-limits {
        include /etc/nginx/snippets/public-client-api.conf;
        proxy_pass http://localhost:7010/check-betting-limits;
    }

    # Public client - Raw IP manager work time
    location = /api/manager/work_time {
        include /etc/nginx/snippets/public-client-api.conf;
        proxy_pass http://localhost:7020/work_time;
    }

    # Public client - Raw IP manager filters
    location = /api/manager/filters {
        include /etc/nginx/snippets/public-client-api.conf;
        proxy_pass http://localhost:7020/filters;
    }

    # Public client - Raw IP bet logging
    location = /api/manager/log_bet {
