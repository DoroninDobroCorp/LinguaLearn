pairs_matching:
  send_interval: 500 # Milliseconds
  update_keys_cache_interval: 3   # ОПТИМИЗАЦИЯ 2025-11-09: было 20, стало 3 сек (устранение потерь пар)
  update_pairs_cache_interval: 2  # ОПТИМИЗАЦИЯ 2025-11-09: было 15, стало 2 сек (устранение потерь пар)
  clear_cache_interval: 30
  match_data_timeout: 120
  live_match_data_timeout: 7
  receive_workers_count: 24
  pair_timeout: 5
  min_roi_threshold: -1.0 # Minimum ROI % (validation: -100 to 100)
  max_price_age_seconds: 15 # LIVE: base prices refresh ~1s; specials refresh ~11s
  max_price_age_for_betting_seconds: 5 # Calculator independently enforces the same 5s match-level limit
  enable_low_odds: true
  low_odds_threshold: 1.3
  enable_equivalences_v2: true # V2: canonical market matching (Win=H-0.5, DC=H+0.5, CS 0-0=T<0.5)
  min_stability_seconds: 2.0 # LIVE: pair must exist ≥2s before showing (filters score-change flicker)

price_storage:
  clear_interval: 300
  data_timeout: 900

channels:
  receive_buffer_size: 500    # Parser input buffer (scaled for 10+ bookmakers)
  send_buffer_size: 500

security:
  allowed_origins:
    - "*"
  api_keys:
    pinnacle: "pinnacle_secret_key_change_in_production"
    sansabet: "sansabet_secret_key_change_in_production"
    lobbet: "lobbet_secret_key_change_in_production"
    betcenter: "betcenter_secret_key_change_in_production"
    unibet: "unibet_secret_key_change_in_production"
    hatbet: "hatbet_secret_key_change_in_production"
    zlatnik: "zlatnik_secret_key_change_in_production"
    soccerbet: "soccerbet_secret_key_change_in_production"
    volcano: "volcano_secret_key_change_in_production"
    sbbet: "sbbet_secret_key_change_in_production"
    ggbet: "ggbet_secret_key_change_in_production"
    vbet: "vbet_secret_key_change_in_production"
    betfair: "betfair_secret_key_change_in_production"
