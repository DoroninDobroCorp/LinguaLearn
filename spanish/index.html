<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#c026d3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Spanish" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/spanish/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/spanish/pwa-192.png" />
    <link rel="icon" type="image/svg+xml" href="/spanish/pwa-icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/spanish/apple-touch-icon.png" />
    <title>Spanish Learning Assistant</title>
    <script>
      // 1. Register Service Worker immediately in head
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/spanish/sw.js', { scope: '/spanish' }).catch(function() {});
      }

      // 2. Offline fallback card function
      function showOfflineFallback(msg) {
        var statusEl = document.getElementById('offline-load-status');
        if (statusEl) {
          var spinEl = document.getElementById('offline-spinner');
          if (spinEl) spinEl.style.display = 'none';
          statusEl.innerHTML = '<div style="background:#fff;padding:18px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,0.08);max-width:320px;margin:12px auto;border:1px solid #fbcfe8;">' +
            '<div style="color:#9333ea;font-weight:900;font-size:16px;margin-bottom:6px;">Офлайн-режим 🇪🇸</div>' +
            '<div style="font-size:12px;color:#6b7280;margin-bottom:14px;line-height:1.4;">' + (msg || 'Приложение готово к офлайн-тренировкам.') + '</div>' +
            '<div style="display:flex;flex-direction:column;gap:8px;">' +
              '<a href="/spanish/exercises" style="display:block;padding:11px 16px;background:linear-gradient(to right,#d946ef,#9333ea);color:#fff;border-radius:14px;font-weight:bold;font-size:13px;text-decoration:none;box-shadow:0 4px 12px rgba(147,51,234,0.3);">🎯 Открыть Тренажер</a>' +
              '<a href="/spanish/vocabulary" style="display:block;padding:11px 16px;background:#fdf4ff;border:1.5px solid #e9d5ff;color:#9333ea;border-radius:14px;font-weight:bold;font-size:13px;text-decoration:none;">📖 Открыть Словарь</a>' +
              '<button onclick="location.reload()" style="margin-top:4px;padding:8px 16px;background:transparent;color:#9ca3af;border:none;font-size:12px;font-weight:bold;cursor:pointer;">Повторить запуск 🔄</button>' +
            '</div>' +
          '</div>';
        }
      }

      // 3. Capture errors during script download or execution (useCapture=true)
      window.addEventListener('error', function(e) {
        showOfflineFallback('Офлайн-запуск: соединение отсутствует или нестабильно');
      }, true);

      // 4. Watchdog timer: if React hasn't mounted in 3.5s, display recovery launcher
      setTimeout(function() {
        var statusEl = document.getElementById('offline-load-status');
        if (statusEl && statusEl.innerText.indexOf('Запуск') !== -1) {
          showOfflineFallback('Приложение готово к офлайн-занятиям.');
        }
      }, 3500);
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#fdf2f8 0%,#f5d0fe 50%,#fdf2f8 100%);font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div style="font-size:52px;margin-bottom:12px;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.1));">🇪🇸</div>
        <div style="font-size:22px;font-weight:900;background:linear-gradient(to right,#d946ef,#9333ea);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;">LinguaLearn Spanish</div>
        <div id="offline-load-status" style="font-size:14px;font-weight:600;color:#6b7280;margin-bottom:16px;">Запуск приложения...</div>
        <div id="offline-spinner" style="width:36px;height:36px;border:3px solid #f3e8ff;border-top-color:#c026d3;border-radius:50%;animation:pwa-spin 1s linear infinite;"></div>
        <style>@keyframes pwa-spin{to{transform:rotate(360deg)}}</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
