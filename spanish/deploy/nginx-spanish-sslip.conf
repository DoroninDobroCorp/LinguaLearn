server {
    listen 80;
    server_name 145.239.82.124.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name 145.239.82.124.sslip.io;

    ssl_certificate /etc/letsencrypt/live/145.239.82.124.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/145.239.82.124.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /spanish/api/ {
        proxy_pass http://localhost:3003/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location = /spanish {
        return 301 /spanish/;
    }

    location = /spanish/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        return 302 /spanish/vocabulary;
    }

    location /spanish/ {
        alias /srv/LinguaLearn/spanish/dist/;
        index index.html;
        try_files $uri /spanish/index.html;
    }

    location / {
        return 302 /spanish/vocabulary;
    }
}
