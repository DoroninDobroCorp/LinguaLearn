name: LinguaLearn
options:
  bundleIdPrefix: ai.factory.lingualearn
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "14.0"

settings:
  SWIFT_VERSION: "5.7"

targets:
  LinguaLearnContainerApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LinguaLearnContainerApp
        excludes:
          - "*.entitlements"
      - path: LinguaLearnKeyboardExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      PRODUCT_NAME: LinguaLearnContainerApp
      PRODUCT_MODULE_NAME: LinguaLearnContainerApp
      PRODUCT_BUNDLE_IDENTIFIER: ai.factory.lingualearn.app
      INFOPLIST_FILE: LinguaLearnContainerApp/Info.plist
      ENTITLEMENTS_FILE: LinguaLearnContainerApp/LinguaLearnContainerApp.entitlements
      ENABLE_TESTABILITY: "YES"
    dependencies:
      - target: LinguaLearnKeyboardExtension

  LinguaLearnKeyboardExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LinguaLearnKeyboardExtension
        excludes:
          - "*.entitlements"
    settings:
      PRODUCT_NAME: LinguaLearnKeyboardExtension
      PRODUCT_MODULE_NAME: LinguaLearnKeyboardExtension
      PRODUCT_BUNDLE_IDENTIFIER: ai.factory.lingualearn.app.keyboard
      INFOPLIST_FILE: LinguaLearnKeyboardExtension/Info.plist
      ENTITLEMENTS_FILE: LinguaLearnKeyboardExtension/LinguaLearnKeyboardExtension.entitlements

  LinguaLearnTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LinguaLearnTests
    settings:
      PRODUCT_NAME: LinguaLearnTests
      PRODUCT_MODULE_NAME: LinguaLearnTests
      PRODUCT_BUNDLE_IDENTIFIER: ai.factory.lingualearn.tests
      GENERATE_INFOPLIST_FILE: "YES"
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LinguaLearnContainerApp.app/LinguaLearnContainerApp"
      BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: LinguaLearnContainerApp

schemes:
  LinguaLearnContainerApp:
    build:
      targets:
        LinguaLearnContainerApp: all
        LinguaLearnKeyboardExtension: all
        LinguaLearnTests: [test]
    test:
      targets:
        - LinguaLearnTests
