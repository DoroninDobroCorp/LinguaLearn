name: Windows Agent CI

# Status: Configured for Windows WPF Agent .NET 8 CI.
# Note: If GitHub Actions Windows runner billing/quota is locked externally, mark status BLOCKED_EXTERNAL in audit report artifacts.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore windows/LinguaLearnAgent.sln

    - name: Build solution
      run: dotnet build windows/LinguaLearnAgent.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test windows/LinguaLearnAgent.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

    - name: Upload Test Results & Build Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-dotnet-test-results
        path: |
          windows/**/TestResults/*.trx
          windows/LinguaLearnAgent/bin/Release/net8.0-windows/

