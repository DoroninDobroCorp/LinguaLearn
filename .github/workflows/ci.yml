name: Cross-Platform CI Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  node-backend-and-frontend:
    name: Node Backend & Web Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'english/package-lock.json'

      - name: Install Node dependencies
        run: cd english && npm ci

      - name: Build Web Frontend
        run: cd english && npm run build

      - name: Run Node Backend & Integration Unit Tests
        run: cd english && node --test tests/*.test.mjs

  macos-swift:
    name: macOS Swift Desktop Client
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Swift Package Tests
        run: cd macos/LinguaLearnCapture && swift test

      - name: Build Swift Desktop Package
        run: cd macos/LinguaLearnCapture && swift build -c release

  ios-simulator:
    name: iOS Simulator Container & Keyboard Extension
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run iOS Simulator Unit Tests
        run: cd ios/LinguaLearn && xcodebuild test -project LinguaLearn.xcodeproj -scheme LinguaLearnContainerApp -destination 'platform=iOS Simulator,name=iPhone 16'

  android-gradle:
    name: Android IME & Container App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Android Unit Tests
        run: cd android/LinguaLearn && ./gradlew test

      - name: Assemble Debug APK
        run: cd android/LinguaLearn && ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/LinguaLearn/app/build/outputs/apk/debug/*.apk

  windows-dotnet:
    name: Windows Desktop WPF Agent
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore windows/LinguaLearnAgent.sln

      - name: Build solution
        run: dotnet build windows/LinguaLearnAgent.sln --configuration Release --no-restore

      - name: Run C# unit tests
        run: dotnet test windows/LinguaLearnAgent.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"
